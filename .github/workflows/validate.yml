name: QuestionTube Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate QuestionTube v0.1
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/validate.yml

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jsonschema>=4.18,<5"

      - name: Check Python syntax
        run: |
          python -m py_compile scripts/validate_examples.py

      - name: Validate QuestionTube examples
        run: |
          python scripts/validate_examples.py

      - name: Verify expected fixture coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("examples")

          expected = {
              "pass": 9,
              "fail": 15,
          }

          for category, minimum in expected.items():
              total = 0

              for path in sorted(
                  (root / category).glob("*.json")
              ):
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  total += len(data["cases"])

              print(
                  f"{category}: "
                  f"{total} cases "
                  f"(minimum {minimum})"
              )

              if total < minimum:
                  raise SystemExit(
                      f"Insufficient {category} coverage"
                  )

          print("Fixture coverage: PASS")
          PY
